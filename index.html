<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>ZT Label Designer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div><strong>ZT Label Designer</strong><small>Zebra ZT410 · ZPL · Bluetooth Classic</small></div>
  <div class="top-actions"><button id="newBtn">New</button><button id="saveBtn">Save</button><button id="loadBtn">Load</button></div>
</header>
<main class="app">
<section class="toolbar">
<button data-add="text">＋ Text</button><button data-add="barcode">＋ Barcode</button><button data-add="qr">＋ QR</button><button data-add="line">＋ Line</button><button data-add="box">＋ Box</button>
</section>
<section class="printer-card">
<div class="row"><label>Width <input id="labelW" type="number" step="0.1" value="40"></label><label>Height <input id="labelH" type="number" step="0.1" value="25"></label><label>DPI <select id="dpi"><option value="203">203</option><option value="300">300</option></select></label></div>
<div class="row"><span id="serialSupport" class="pill">Checking Web Serial…</span><span id="printerStatus" class="pill">Disconnected</span><button id="connectBtn" class="primary">🔵 Kết nối ZT410</button><button id="disconnectBtn">Ngắt kết nối</button></div>
</section>
<section class="workspace"><div class="canvas-wrap"><div id="canvas" class="label-canvas" aria-label="Label canvas"></div></div><aside class="properties"><h3>Thuộc tính</h3><div id="emptyProps" class="muted">Chạm một đối tượng để chỉnh sửa.</div><div id="props" hidden></div></aside></section>
<section class="bottom-actions"><button id="previewBtn">Preview ZPL</button><button id="copyBtn">Copy ZPL</button><button id="printBtn" class="primary">🖨 In</button></section>
</main>
<dialog id="zplDialog"><form method="dialog" class="dialog"><h3>ZPL</h3><textarea id="zplOutput" spellcheck="false"></textarea><div class="dialog-actions"><button value="cancel">Đóng</button><button id="dialogCopy" type="button">Copy</button></div></form></dialog>
<dialog id="templateDialog"><form method="dialog" class="dialog"><h3>Templates</h3><div id="templateList"></div><div class="dialog-actions"><button value="cancel">Đóng</button></div></form></dialog>
<script src="js/zpl-generator.js"></script><script src="js/printer.js"></script><script src="js/app.js"></script>
</body></html>
