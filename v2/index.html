<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>ZT Label Designer V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#f4f6f8;font:14px system-ui}header{padding:12px;background:#111827;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:8px;align-items:center}header small{display:block;color:#9aa5b1;font-size:11px}.bar,.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.bar{padding:9px;overflow:auto}.bar button,button{border:1px solid #39424e;background:#18202a;color:#fff;border-radius:9px;padding:9px 11px}button.primary{background:#1463ff;border-color:#1463ff}.card{margin:0 9px 9px;padding:9px;background:#121923;border:1px solid #273140;border-radius:10px}.pill{padding:6px 9px;background:#1b2531;border-radius:99px;font-size:12px}.work{display:grid;grid-template-columns:1fr 280px;gap:9px;padding:0 9px}.stage{min-height:480px;background:#151b23;border:1px solid #273140;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:auto;padding:18px}.label{position:relative;background:white;box-shadow:0 8px 25px #0008;flex:none}.obj{position:absolute;color:#111;touch-action:none;user-select:none;overflow:hidden;cursor:move}.sel{outline:2px solid #1463ff}.box{border:2px solid #111}.line{background:#111}.qr{border:2px solid #111;display:grid;place-items:center;font:10px monospace;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 50%/12px 12px}.barcode{font-size:11px;text-align:center}.bars{height:75%;display:flex}.bars i{height:100%}.props{background:#121923;border:1px solid #273140;border-radius:10px;padding:10px}.props h3{margin:0 0 8px}.props label{display:block;color:#aeb8c4;font-size:12px;margin:6px 0}.props input{width:100%;padding:7px;background:#0b0f14;color:white;border:1px solid #39424e;border-radius:7px}.bottom{padding:9px;display:flex;gap:7px;position:sticky;bottom:0;background:#0b0f14}.bottom button{flex:1}.modal{position:fixed;inset:10%;background:#111827;border:1px solid #39424e;border-radius:10px;padding:12px;z-index:10}.modal textarea{width:100%;height:70%;background:#080c11;color:#fff;border:1px solid #39424e;border-radius:7px;font:12px monospace}@media(max-width:800px){.work{grid-template-columns:1fr}.props{min-height:120px}}
</style></head><body>
<header><div><b>ZT Label Designer V2</b><small>Zebra ZT410 · 40×25 mm · 203 DPI · ZPL</small></div><div class="row"><button id="new">New</button><button id="save">Save</button></div></header>
<div class="bar"><button data-add="text">＋ Text</button><button data-add="barcode">＋ Barcode</button><button data-add="qr">＋ QR</button><button data-add="box">＋ Box</button><button id="connect" class="primary">🔵 Connect ZT410</button><button id="disconnect">Disconnect</button></div>
<div class="card"><div class="row"><label>W <input id="w" type="number" value="40" step=".1"></label><label>H <input id="h" type="number" value="25" step=".1"></label><label>DPI <select id="dpi"><option>203</option><option>300</option></select></label><span id="support" class="pill"></span><span id="status" class="pill">Disconnected</span></div></div>
<div class="work"><div class="stage"><div id="label" class="label"></div></div><aside class="props"><h3>Thuộc tính</h3><div id="p">Chạm đối tượng để chỉnh sửa.</div></aside></div>
<div class="bottom"><button id="zpl">Preview ZPL</button><button id="copy">Copy ZPL</button><button id="print" class="primary">🖨 In</button></div>
<div id="modal" class="modal" hidden><h3>ZPL</h3><textarea id="out"></textarea><div class="row"><button id="close">Đóng</button></div></div>
<script>
const $=x=>document.getElementById(x);let L={w:40,h:25,dpi:203,o:[]},sel=null,drag=null,port=null,writer=null;const uid=()=>Math.random().toString(36).slice(2)+Date.now();const D={text:{t:'text',x:5,y:4,w:25,h:6,v:'PRODUCT ABC',fs:4},barcode:{t:'barcode',x:5,y:11,w:30,h:9,v:'123456789'},qr:{t:'qr',x:30,y:11,w:8,h:8,v:'ABC123'},box:{t:'box',x:3,y:2,w:34,h:21}};function dots(mm){return Math.round(mm*L.dpi/25.4)}function zpl(){let s='^XA^PW'+dots(L.w)+'^LL'+dots(L.h);for(const o of L.o){const x=dots(o.x),y=dots(o.y);if(o.t==='text')s+='^FO'+x+','+y+'^A0N,'+Math.max(8,dots(o.fs||4))+','+Math.max(8,dots(o.fs||4))+'^FD'+String(o.v||'').replace(/[\^~]/g,' ')+'^FS';if(o.t==='barcode')s+='^FO'+x+','+y+'^BY2^BCN,'+dots(o.h||9)+',Y,N,N^FD'+String(o.v||'').replace(/[\^~]/g,' ')+'^FS';if(o.t==='qr')s+='^FO'+x+','+y+'^BQN,2,4^FDLA'+String(o.v||'').replace(/[\^~]/g,' ')+'^FS';if(o.t==='box')s+='^FO'+x+','+y+'^GB'+dots(o.w)+','+dots(o.h)+',2^FS'}return s+'^XZ'}function save(){localStorage.setItem('zt-v2',JSON.stringify(L))}function render(){L.w=+L.w||40;L.h=+L.h||25;L.dpi=+L.dpi||203;$('w').value=L.w;$('h').value=L.h;$('dpi').value=L.dpi;const s=Math.max(5,Math.min(16,(innerWidth-55)/L.w));$('label').style.width=L.w*s+'px';$('label').style.height=L.h*s+'px';$('label').innerHTML='';for(const o of L.o){const e=document.createElement('div');e.className='obj '+(o.t==='box'?'box':'')+(o.t==='qr'?' qr':'')+(o.t==='barcode'?' barcode':'')+(o.t==='line'?' line':'')+(o.id===sel?' sel':'');e.style.left=o.x*s+'px';e.style.top=o.y*s+'px';e.style.width=o.w*s+'px';e.style.height=o.h*s+'px';if(o.t==='text'){e.textContent=o.v;e.style.fontSize=Math.max(6,o.fs*s)+'px'}else if(o.t==='barcode'){e.innerHTML='<div class="bars">'+Array.from({length:50},(_,i)=>'<i style="width:'+(i%3?'2px':'1px')+';background:'+(i%2?'#111':'transparent')+'"></i>').join('')+'</div>'+o.v}else if(o.t==='qr')e.textContent='QR\\n'+o.v;e.onpointerdown=ev=>{sel=o.id;drag={sx:ev.clientX,sy:ev.clientY,x:o.x,y:o.y,id:o.id};e.setPointerCapture?.(ev.pointerId);render()};$('label').appendChild(e)}props()}function props(){const o=L.o.find(x=>x.id===sel),p=$('p');if(!o){p.textContent='Chạm đối tượng để chỉnh sửa.';return}p.innerHTML='';['x','y','w','h'].forEach(k=>{const l=document.createElement('label');l.textContent=k.toUpperCase();const i=document.createElement('input');i.type='number';i.step='.1';i.value=o[k];i.oninput=()=>{o[k]=+i.value;save();render()};l.append(i);p.append(l)});if('v'in o){const l=document.createElement('label');l.textContent='Data/Text';const i=document.createElement('input');i.value=o.v;i.oninput=()=>{o.v=i.value;save();render()};l.append(i);p.append(l)}const b=document.createElement('button');b.textContent='Delete';b.onclick=()=>{L.o=L.o.filter(x=>x.id!==o.id);sel=null;save();render()};p.append(b)}$('label').onpointermove=e=>{if(!drag)return;const s=Math.max(5,Math.min(16,(innerWidth-55)/L.w)),o=L.o.find(x=>x.id===drag.id);if(o){o.x=Math.max(0,drag.x+(e.clientX-drag.sx)/s);o.y=Math.max(0,drag.y+(e.clientY-drag.sy)/s);render()}};$('label').onpointerup=()=>{drag=null;save()};document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const o={...D[b.dataset.add],id:uid()};L.o.push(o);sel=o.id;save();render()});$('w').oninput=e=>{L.w=+e.target.value;save();render()};$('h').oninput=e=>{L.h=+e.target.value;save();render()};$('dpi').onchange=e=>{L.dpi=+e.target.value;save();render()};$('new').onclick=()=>{L={w:40,h:25,dpi:203,o:[]};sel=null;save();render()};$('save').onclick=()=>{const n=prompt('Tên template','ZT410-40x25');if(n)localStorage.setItem('zt-template-'+n,JSON.stringify(L))};$('zpl').onclick=()=>{$('out').value=zpl();$('modal').hidden=false};$('close').onclick=()=>{$('modal').hidden=true};$('copy').onclick=()=>navigator.clipboard.writeText(zpl());$('connect').onclick=async()=>{try{if(!('serial'in navigator))throw Error('Chrome không hỗ trợ Web Serial trên thiết bị này.');port=await navigator.serial.requestPort();await port.open({baudRate:115200});$('status').textContent='Connected'}catch(e){alert(e.message)}};$('disconnect').onclick=async()=>{if(port){try{await port.close()}catch{}port=null}$('status').textContent='Disconnected'};$('print').onclick=async()=>{try{if(!port)throw Error('Chưa kết nối ZT410');writer=port.writable.getWriter();await writer.write(new TextEncoder().encode(zpl()));writer.releaseLock();writer=null;$('status').textContent='Print command sent'}catch(e){alert(e.message)}};$('support').textContent='Web Serial: '+(('serial'in navigator)?'supported':'unsupported');try{const x=JSON.parse(localStorage.getItem('zt-v2'));if(x)L=x}catch{}if(!L.o.length)L.o=[{...D.text,id:uid()},{...D.barcode,id:uid()}];render();
</script></body></html>
